name: Rust desktop and native Android

on:
  push:
    branches: [main, 'rewrite/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libx11-xcb-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release -p relay-desktop -p relay-server -p relay-migrate
      - name: Windows executable lifecycle smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TestDirectory = Join-Path $env:RUNNER_TEMP 'lan-relay-ci-smoke'
          $Process = Start-Process -FilePath ./target/release/lan-relay.exe -ArgumentList @('--smoke-test', '--data-dir', $TestDirectory) -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Desktop smoke failed with exit code $($Process.ExitCode)" }
          $Report = Get-Content -LiteralPath (Join-Path $TestDirectory 'smoke-report.json') -Raw | ConvertFrom-Json
          if ($Report.single_instance -ne 'PASS' -or $Report.http_hello -ne 'PASS' -or $Report.shutdown -ne 'PASS') { throw 'Desktop smoke report did not pass' }
          Get-Content -LiteralPath (Join-Path $TestDirectory 'smoke-report.json')
      - name: Collect Windows applications
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/Build.ps1 -SkipBuild
      - name: Artifact manifest
        if: runner.os == 'Windows'
        run: python tools/artifact_manifest.py output/dist/windows --source ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: lan-relay-windows-${{ github.sha }}
          path: output/dist/windows/
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android native app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Android API 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test, lint and assemble
        run: ./apps/android/gradlew -p apps/android --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Collect Android packages
        run: python tools/collect_android.py --source ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: lan-relay-android-${{ github.sha }}
          path: output/dist/android/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-${{ github.sha }}
          path: apps/android/app/build/reports/
          retention-days: 30
