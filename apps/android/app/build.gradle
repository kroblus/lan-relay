plugins { id 'com.android.application' }

android {
    namespace 'com.kroblus.lanrelay'
    compileSdk 37
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.kroblus.lanrelay'
        minSdk 29
        targetSdk 37
        versionCode 2
        versionName '0.2.0'
        manifestPlaceholders = [appLabel: '随手传']
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            manifestPlaceholders = [appLabel: '随手传·试用']
        }
        release {
            minifyEnabled false
            // Intentionally unsigned. Production signing keys are kept by the owner.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.4'
    testImplementation 'junit:junit:4.13.2'
}
