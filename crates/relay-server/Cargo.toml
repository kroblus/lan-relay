[package]
name = "relay-server"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
relay-core = { path = "../relay-core" }
axum = { version = "0.8", features = ["json", "http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
uuid = { version = "1", features = ["v4"] }
